name: Build for macOS M1

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS M1
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Select Xcode
        shell: bash
        run: |
          XCODE_PATH="$(/usr/bin/find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode.app found in /Applications" >&2
            exit 1
          fi

          export DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          swift -version

      - name: Fix Xcode package plugin validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Generate Xcode project with Tuist
        shell: bash
        run: |
          mise install
          mise exec -- tuist install
          mise exec -- tuist generate

      - name: Build for M1
        shell: bash
        run: |
          xcodebuild build \
            -project Cork.xcodeproj \
            -scheme Cork \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cork-macOS-M1
          path: build/Build/Products/Release/
          if-no-files-found: error
          retention-days: 7
