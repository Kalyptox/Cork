name: Build for macOS M1

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS M1
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "$DEVELOPER_DIR"
          xcodebuild -version
          swift -version

      - name: Fix Xcode package plugin validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Generate Xcode project with Tuist
        shell: bash
        run: |
          mise install
          mise exec -- tuist install
          mise exec -- tuist generate

      - name: Build for M1
        shell: bash
        run: |
          xcodebuild build \
            -project Cork.xcodeproj \
            -scheme Cork \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cork-macOS-M1
          path: build/Build/Products/Release/
          if-no-files-found: error
          retention-days: 7
